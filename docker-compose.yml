services:
  mongodb:
    image: mongo:6
    container_name: trashtracker-mongodb
    ports:
      - "27017:27017"
    volumes:
      - trashtracker_mongodb_data:/data/db

  api:
    build: .
    container_name: trashtracker-api
    depends_on:
      - mongodb
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/trashtracker
      MONGO_DB_NAME: trashtracker
      CORS_ORIGIN: "*"

volumes:
  trashtracker_mongodb_data:
